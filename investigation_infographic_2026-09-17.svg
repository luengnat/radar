    <line x1="28" y1="140" x2="1380" y2="140" stroke="#315366"/>
    <g class="thai white small">
      <text x="28" y="184">ชุมพร</text><text x="250" y="184" class="cyan">410.987</text><text x="565" y="184">412.143</text><text x="890" y="184" class="red">391.620</text><text x="1230" y="184" class="orange">+4.71%</text>
      <text x="28" y="234">บึงกาฬ</text><text x="250" y="234" class="cyan">415.160</text><text x="565" y="234">419.440</text><text x="890" y="234" class="red">375.570</text><text x="1230" y="234" class="orange">+9.54%</text>
      <text x="28" y="284">พิษณุโลก</text><text x="250" y="284" class="cyan">408.954</text><text x="565" y="284">410.987</text><text x="890" y="284" class="red">389.480</text><text x="1230" y="284" class="orange">+4.76%</text>
      <text x="28" y="334">กระบี่</text><text x="250" y="334" class="cyan">412.699</text><text x="565" y="334">414.625</text><text x="890" y="334" class="red">375.570</text><text x="1230" y="334" class="orange">+9.00%</text>
    </g>

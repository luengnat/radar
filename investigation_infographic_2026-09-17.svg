    <text x="26" y="40" class="thai muted label">AWARD RANGE</text>
    <text x="26" y="112" class="display orange" font-size="54">฿409–415M</text>
    <text x="26" y="153" class="thai muted small">ต่อสถานี</text>
  </g>
  <g transform="translate(816 370)" filter="url(#shadow)">

      <text x="80" y="28" class="thai white body">ผู้ยื่นทุกสถานี</text>
      <text x="80" y="62" class="thai muted small">Genomatch / Marwin / รายที่สาม</text>
    </g>
    <line x1="56" y1="190" x2="492" y2="190" stroke="#315366"/>
    <g transform="translate(28 225)">
      <circle cx="30" cy="30" r="30" fill="#183e4b" stroke="#ffb166" stroke-width="2"/>
      <text x="30" y="39" text-anchor="middle" class="display orange" font-size="28">2</text>
      <text x="80" y="28" class="thai white body">ผ่านเทคนิค</text>
      <text x="80" y="62" class="thai muted small">เหลือผู้มีสิทธิ์ 2 ราย</text>
    </g>
    <line x1="56" y1="305" x2="492" y2="305" stroke="#315366"/>
    <g transform="translate(28 340)">

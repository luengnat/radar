  <!-- conclusion -->
  <g transform="translate(96 2070)">
    <rect width="1408" height="82" rx="16" fill="#1b2e34" stroke="#5cf0dc"/>
    <circle cx="42" cy="41" r="17" fill="#5cf0dc"/>

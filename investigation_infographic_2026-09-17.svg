    <text x="26" y="153" class="thai muted small">3.07% จากงบ 1.7B</text>
  </g>
  <g transform="translate(1176 370)" filter="url(#shadow)">
    <rect width="328" height="190" rx="18" fill="#10293a" stroke="#315366"/>

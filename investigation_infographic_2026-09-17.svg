      .display { font-family: 'Noto Sans Thai','Leelawadee UI','Tahoma',sans-serif; font-weight: 800; letter-spacing: -0.5px; }
      .mono { font-family: 'SFMono-Regular','Menlo',monospace; }
      .muted { fill: #98b7c2; }
      .white { fill: #f4fbfc; }
      .cyan { fill: #5cf0dc; }
      .orange { fill: #ffb166; }
      .red { fill: #ff7e72; }
      .line { stroke: #315366; stroke-width: 2; }
      .tiny { font-size: 18px; }
      .small { font-size: 23px; }
      .body { font-size: 27px; }
      .label { font-size: 20px; letter-spacing: 2px; }
    </style>

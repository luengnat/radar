    <text y="105" class="thai muted" font-size="26">ต่างประเทศมีราคาประกาศราว 72–136 ล้านบาท/ระบบ ขณะที่ไทยชนะที่ 409–415 ล้านบาท</text>
    <rect x="0" y="135" width="1408" height="2" fill="#315366"/>
  </g>


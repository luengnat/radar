    <path d="M52 7V89M11 48H93" stroke="#5cf0dc" stroke-opacity="0.25"/>
    <text x="130" y="42" class="display white" font-size="42">เรดาร์อากาศ S-band ปี 2569</text>
    <text x="132" y="80" class="thai muted" font-size="25">หลักฐานราคา • ผู้ยื่นข้อเสนอ • benchmark ต่างประเทศ</text>
    <text x="1405" y="28" class="mono muted" font-size="17" text-anchor="end">EVIDENCE SNAPSHOT / 17 SEP 2026</text>
    <text x="1405" y="57" class="thai muted" font-size="18" text-anchor="end">สรุปจากเอกสารและข้อมูลที่ตรวจแล้ว</text>
  </g>

  <!-- headline -->
  <g transform="translate(96 190)">
    <text class="thai orange" font-size="25">คำตอบสั้นที่สุด</text>
